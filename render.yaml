# CMA Clash — Render Blueprint (backend for Vercel frontend)
# Apply from the Render Dashboard: New > Blueprint > connect this repo.
# After sync, confirm ROOT_ADDRESS/CORS_ORIGINS (defaults: cmaclash.com + Vercel hostname).

databases:
  - name: cmaclash-db
    plan: free
    region: oregon
    databaseName: classquiz

services:
  # Meilisearch (free web service; index rebuilt from Postgres on API boot when out of sync).
  # MEILI_MASTER_KEY is required when MEILI_ENV=production (min 16 bytes).
  - type: web
    name: cmaclash-meilisearch
    runtime: image
    plan: free
    region: oregon
    healthCheckPath: /health
    image:
      url: docker.io/getmeili/meilisearch:v1.7
    envVars:
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_ENV
        value: production
      - key: MEILI_HTTP_ADDR
        value: 0.0.0.0:10000
      - key: MEILI_MASTER_KEY
        generateValue: true

  - type: keyvalue
    name: cmaclash-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    # Empty list = private-network only (no public Redis). API reaches it via connectionString.
    ipAllowList: []

  - type: web
    name: cmaclash-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    dockerCommand: ./render_start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: cmaclash-db
          property: connectionString
      - key: REDIS
        fromService:
          type: keyvalue
          name: cmaclash-redis
          property: connectionString
      - key: MEILISEARCH_URL
        fromService:
          type: web
          name: cmaclash-meilisearch
          envVarKey: RENDER_EXTERNAL_URL
      - key: MEILISEARCH_API_KEY
        fromService:
          type: web
          name: cmaclash-meilisearch
          envVarKey: MEILI_MASTER_KEY
      - key: MEILISEARCH_INDEX
        value: cmaclash
      - key: AUTO_SEED_CONTENT
        value: "true"
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: MAX_WORKERS
        value: "1"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: MAIL_FROM
        value: CMA Clash <noreply@cmaclash.com>
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_ADDRESS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
        sync: false
      - key: ROOT_ADDRESS
        value: https://cmaclash.com
        sync: false
      - key: CORS_ORIGINS
        value: https://cmaclash.com,https://cmaclash.vercel.app,http://localhost:3000,http://127.0.0.1:3000
        sync: false
      # Allows the local dev server (vite dev on :3000) to call the API directly.
      # The dev site normally goes through the same-origin proxy, so this is a
      # convenience for tools that talk to the API cross-origin.
      - key: CORS_ALLOW_LOCALHOST
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
