# CMA Clash — Render Blueprint (backend for Vercel frontend)
# Apply from the Render Dashboard: New > Blueprint > connect this repo.
# After sync, set ROOT_ADDRESS and CORS_ORIGINS to your Vercel URL (sync: false prompts).

databases:
  - name: cmaclash-db
    plan: free
    databaseName: classquiz

services:
  # Meilisearch (free web service; index is rebuilt from Postgres on API boot when out of sync).
  # Ephemeral disk: search may be empty after cold start until the API finishes meilisearch_init.
  # For a persistent index, switch to a paid private service + disk (see docs/DEPLOY_VERCEL.md).
  - type: web
    name: cmaclash-meilisearch
    runtime: image
    plan: free
    healthCheckPath: /health
    image:
      url: docker.io/getmeili/meilisearch:v1.7
    envVars:
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_ENV
        value: production
      - key: MEILI_HTTP_ADDR
        value: 0.0.0.0:10000

  - type: keyvalue
    name: cmaclash-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList:
      - source: 0.0.0.0/0
        description: all (required field; traffic uses Render private network between services)

  - type: web
    name: cmaclash-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    dockerCommand: ./render_start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_URL
        fromDatabase:
          name: cmaclash-db
          property: connectionString
      - key: REDIS
        fromService:
          type: keyvalue
          name: cmaclash-redis
          property: connectionString
      - key: MEILI_HOSTPORT
        fromService:
          type: web
          name: cmaclash-meilisearch
          property: hostport
      - key: MEILISEARCH_INDEX
        value: cmaclash
      - key: AUTO_SEED_CONTENT
        value: "true"
      - key: SKIP_EMAIL_VERIFICATION
        value: "true"
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: MAX_WORKERS
        value: "1"
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_PATH
        value: /var/data/uploads
      - key: MAIL_ADDRESS
        value: noreply@example.com
      - key: MAIL_USERNAME
        value: noreply@example.com
      - key: MAIL_PASSWORD
        value: unused
      - key: MAIL_SERVER
        value: localhost
      - key: MAIL_PORT
        value: "587"
      - key: ROOT_ADDRESS
        sync: false
      - key: CORS_ORIGINS
        sync: false
