<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0B0F1A" />
		<style>
			html {
				background-color: #0b0f1a;
				color-scheme: dark;
			}
		</style>
		<script>
			window.plausible =
				window.plausible ||
				function () {
					(window.plausible.q = window.plausible.q || []).push(arguments);
				};
		</script>

		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="%sveltekit.assets%/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="%sveltekit.assets%/favicon-16x16.png"
		/>
		<link rel="icon" href="%sveltekit.assets%/logo-mark.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="CMA Clash" />
		<meta name="application-name" content="CMA Clash" />
		<meta name="msapplication-TileColor" content="#0B0F1A" />

	<body>
